<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PIG Game</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <h1 id="h-game">PIG Game</h1>
        <div class="container">
            <div class="box-0">
                <h1 id="p-head">Player 1</h1>
                <div class="score s--0">0</div>
                <div class="s-box">
                    <h3 id="s-head0">Score</h3>
                    <div class="num score0">0</div>
                </div>
            </div>
            <div class="btns">
                <button class="st-btn btn">
                    <span style="font-size: 24px"><b>&#127918;</b></span
                    ><b> Play</b>
                </button>
                <button class="rs-btn btn hidden">
                    <span style="font-size: 20px"
                        ><i class="fa-solid fa-rotate-right"></i
                    ></span>
                    New Game
                </button>
                <div class="dice hidden" alt="dice..."></div>
                <button class="sff-btn btn">
                    <span style="font-size: 20px"
                        ><i class="fa-solid fa-shuffle"></i
                    ></span>
                    Shuffle
                </button>
                <button class="h-btn btn">
                    <span style="font-size: 20px"
                        ><i class="fa-solid fa-handshake"></i
                    ></span>
                    Hold
                </button>
            </div>
            <div class="box-1 slider">
                <h1 id="p-head">Player 2</h1>
                <div class="score s--1">0</div>
                <div class="s-box">
                    <h3 id="s-head1">Score</h3>
                    <div class="num score1">0</div>
                </div>
            </div>
        </div>
        <script src="app.js"></script>
    </body>
</html>
